[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bet-agent"
version = "0.1.0"
description = "Multi-Agent Sports Betting System powered by OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "scipy>=1.11",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "streamlit-autorefresh>=1.0",
]
telegram = [
    "python-telegram-bot>=20.0",
]
scraping = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.0",
    "alembic>=1.12",
]

[project.scripts]
betagent-gap-scan = "bet_agent.tools.data_janitor_runner:cli_gap_scan"
betagent-backfill = "bet_agent.tools.data_janitor_runner:cli_backfill_day"
betagent-reconcile = "bet_agent.tools.data_janitor_runner:cli_reconcile_open_results"
betagent-coverage = "bet_agent.tools.data_janitor_runner:cli_coverage_report"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
