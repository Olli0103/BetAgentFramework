# BetAgent Multi-Agent System Configuration
# ═══════════════════════════════════════════
# 9 Agents | 2 LLM Tiers | Human-in-the-Loop (GlüStV compliant)
#
# Golden Rules enforced:
#   1. No LLM Math — all math via deterministic Python tools
#   2. Stateful Memory — PostgreSQL is the single source of truth
#   3. Multi-Market ML — Match Winner, O/U, BTTS, Spreads
#   4. Moonshot Rule — parlays hard-capped at 1.00 EUR
#   5. Paper Trading Sandbox — separate Real/Paper ledgers
#   6. Intelligent LLM Routing — Tier 1 vs Tier 2
#   7. Async In-Play Trading — live bets only during natural breaks

system:
  name: "BetAgent Quant Trading Syndicate"
  version: "0.1.0"
  database_url_env: DATABASE_URL
  human_in_the_loop: true
  supported_sports:
    - football
    - tennis
    - ice_hockey
    - basketball
    - darts
    - american_football
  alert_channels:
    - type: telegram
      config_env: TELEGRAM_BOT_TOKEN
    - type: push_notification
      config_env: PUSH_NOTIFICATION_KEY

agents:
  # ── 1. MASTER AGENT (Portfolio Manager) ──────────────────────────────
  - id: master
    name: "Master Agent"
    role: "Portfolio Manager, CEO & Syndicate Concierge"
    llm_tier: tier1_heavy_reasoning
    soul_file: agents/master/SOUL.md
    description: >
      Orchestrates all workflows. Routes picks through the pipeline,
      decides Paper vs Real placement, broadcasts alerts to the
      syndicate team, and answers natural language queries from
      Telegram as the fund's AI concierge.
    tools:
      # Pipeline tools
      - route_to_agent
      - query_bankroll_ledger
      - push_alert_to_human
      - log_decision
      - run_daily_predictions
      - get_positive_ev_predictions
      - update_prediction_status
      - run_veto_checks
      - shop_all_approved
      - size_all_approved
      - push_alert
      - push_daily_summary
      - build_ticket
      # Settlement tools
      - fetch_and_update_results
      - settle_finished_matches
      - run_daily_audit
      # Concierge read-only tools
      - fetch_portfolio_summary
      - fetch_model_health
      - explain_veto_reason
      - fetch_recent_activity
      - fetch_sport_exposure
      - fetch_pending_for_human
      - fetch_pnl_timeseries
      - mark_bet_placed_by_user
    reports_to: null  # Top of hierarchy
    receives_from:
      - scout
      - data_janitor
      - quant
      - devils_advocate
      - line_shopper
      - risk_manager
      - moonshot
      - auditor
    schedule: null  # Always active, event-driven

  # ── 2. SCOUT AGENT (Data Gatherer) ──────────────────────────────────
  - id: scout
    name: "Scout Agent"
    role: "Data Gatherer & Live Monitor"
    llm_tier: tier2_local_tools
    soul_file: agents/scout/SOUL.md
    description: >
      Web scraper for pre-match odds and live score/odds APIs.
      Runs the daily Cloudflare morning crawl at 04:00 UTC for
      all 5 major sports. Detects match states (halftime,
      intermission) to trigger the asynchronous live betting workflow.
    tools:
      - fetch_pre_match_odds
      - poll_live_scores
      - poll_live_odds
      - detect_match_state
      - update_match_record
      - run_morning_crawl
      - hand_off_crawl_results
      - fetch_injuries
      - fetch_standings
      - fetch_fixtures
    reports_to: master
    schedule:
      morning_crawl: "0 4 * * *"       # Daily at 04:00 UTC — Cloudflare stats
      pre_match_scan: "0 */2 * * *"    # Every 2 hours
      live_polling: see in_play_trigger
    # ── External API providers ────────────────────────────────────────
    odds_api:
      provider: the-odds-api
      base_url: "https://api.the-odds-api.com/v4"
      api_key_env: THE_ODDS_API_KEY
      # Regions for German-legal sportsbooks
      regions: eu
      markets:
        - h2h              # 1X2 / Moneyline
        - spreads           # Handicap / Spread
        - totals            # Over/Under
      odds_format: decimal
      sports_mapping:
        football: soccer_germany_bundesliga,soccer_germany_bundesliga2,soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_uefa_champs_league
        american_football: americanfootball_nfl,americanfootball_nfl_super_bowl_winner
        basketball: basketball_nba
        ice_hockey: icehockey_nhl
        tennis: tennis_atp_french_open,tennis_atp_us_open,tennis_atp_wimbledon
    api_sports:
      provider: api-sports.io
      api_key_env: API_SPORTS_KEY     # Same key for all sport APIs
      auth_header: x-apisports-key    # NOT Authorization: Bearer
      # Each sport = separate API with its own subdomain + version
      # 100 req/day free per API (shared across all sport APIs)
      apis:
        football:
          base_url: "https://v3.football.api-sports.io"
          endpoints: [fixtures, standings, injuries, predictions, odds, teams, players, statistics]
        basketball:
          base_url: "https://v1.basketball.api-sports.io"
          endpoints: [games, standings, odds, teams, statistics]
        nba:
          base_url: "https://v2.nba.api-sports.io"
          endpoints: [games, standings, teams, players, statistics]
        hockey:
          base_url: "https://v1.hockey.api-sports.io"
          endpoints: [games, standings, odds, teams, statistics]
        nfl:
          base_url: "https://v1.american-football.api-sports.io"
          endpoints: [games, standings, teams, players, statistics, injuries]
        # Available but not yet used by our system:
        # baseball:  https://v1.baseball.api-sports.io
        # handball:  https://v1.handball.api-sports.io
        # rugby:     https://v1.rugby.api-sports.io
        # volleyball: https://v1.volleyball.api-sports.io
        # mma:       https://v1.mma.api-sports.io
        # formula1:  https://v1.formula-1.api-sports.io
        # afl:       https://v1.afl.api-sports.io
    cloudflare_crawl:
      enabled: true
      max_crawls_per_day: 5
      max_pages_per_crawl: 100
      render: false  # Fast HTML-only (free during beta)
      sports:
        - american_football
        - basketball
        - ice_hockey
        - football
        - tennis
      retry_on_failure: true
      retry_backoff_seconds: 60
    in_play_trigger:
      enabled: true
      poll_interval_seconds: 30
      trigger_states:
        - halftime
        - intermission
        - set_break
        - end_of_period
        - quarter_break
        - end_of_set
      action: notify_master_for_live_workflow
      message_schema:
        match_id: uuid
        sport: string
        current_score: [int, int]
        match_time: float
        detected_state: string
        live_odds_snapshot: object
      avoid_hft: true
      min_break_duration_seconds: 120  # Only trigger if break >= 2 min

  # ── 3. DATA JANITOR (ETL & Resolution) ──────────────────────────────
  - id: data_janitor
    name: "Data Janitor"
    role: "ETL & Name Resolution"
    llm_tier: tier2_local_tools
    soul_file: agents/data_janitor/SOUL.md
    description: >
      Cleans raw scraped data, normalizes live stats, and resolves
      fuzzy team/player naming conflicts using the team_aliases table.
      Runs historical data imports and builds team daily stat snapshots.
    tools:
      - normalize_team_name
      - resolve_alias
      - clean_odds_data
      - merge_live_stats
      - process_crawl_results
      - upsert_daily_stats
      - run_full_historical_import
      - build_historical_daily_stats
    reports_to: master
    schedule: null  # Triggered by scout output

  # ── 4. QUANT AGENT (Math Engine) ────────────────────────────────────
  - id: quant
    name: "Quant Agent"
    role: "Probability & ML Engine"
    llm_tier: tier2_local_tools
    soul_file: agents/quant/SOUL.md
    description: >
      Executes deterministic Python ML tools. Pre-match: runs XGBoost
      models for ML-powered predictions, falling back to sport-specific
      analytical models (Poisson, hierarchical). In-play: runs
      live_update() combining pre-match expectations with live match
      stats. NEVER does math itself — always calls Python tools.
    tools:
      - calculate_match_outcome_probs
      - calculate_over_under_prob
      - calculate_btts_prob
      - calculate_spread_prob
      - calculate_live_ev
      - calculate_pre_match_ev
      - calculate_ml_pre_match_ev
      - get_sport_model
      - predict_match_winner
      - predict_total
      - find_latest_model
      - run_training_pipeline
      - build_feature_vector
      - estimate_params
    reports_to: master
    schedule: null  # Triggered by data_janitor output

  # ── 5. DEVIL'S ADVOCATE (Qualitative Veto) ──────────────────────────
  - id: devils_advocate
    name: "Devil's Advocate"
    role: "Qualitative Risk Assessor & Veto Power"
    llm_tier: tier1_heavy_reasoning
    soul_file: agents/devils_advocate/SOUL.md
    description: >
      Reads news, social media, and press conferences to identify
      qualitative risks (injuries, fatigue, managerial changes, weather).
      Has VETO power over any pick — can kill a bet before it reaches
      the Risk Manager.
    tools:
      - search_news
      - search_social_media
      - search_reddit
      - check_injury_reports
      - veto_pick
      - approve_pick
      - veto_check
      - run_veto_checks
    reports_to: master
    schedule: null  # Triggered per pick

  # ── 6. LINE SHOPPER (Odds Maximizer) ────────────────────────────────
  - id: line_shopper
    name: "Line Shopper"
    role: "Odds Comparison & Maximizer"
    llm_tier: tier2_local_tools
    soul_file: agents/line_shopper/SOUL.md
    description: >
      Scans legal German sportsbooks (Tipico, Bet365, etc.) for the
      highest available odds on a specific approved pick. Reports the
      best line back to Master.
    tools:
      - compare_odds_across_books
      - get_best_odds
      - query_odds_markets
      - shop_line
      - shop_all_approved
    reports_to: master
    legal_sportsbooks:
      - tipico
      - bet365
      - bwin
      - betano
      - unibet
    schedule: null  # Triggered per approved pick

  # ── 7. RISK MANAGER (Bankroll Sizing) ───────────────────────────────
  - id: risk_manager
    name: "Risk Manager"
    role: "Bankroll Sizing & Risk Control"
    llm_tier: tier2_local_tools
    soul_file: agents/risk_manager/SOUL.md
    description: >
      Calls calculate_quarter_kelly() to size bets. Enforces the
      5% bankroll cap, checks daily/weekly loss limits, and routes
      unproven models to Paper ledger.
    tools:
      - calculate_quarter_kelly
      - query_bankroll_ledger
      - check_daily_loss_limit
      - check_weekly_loss_limit
      - assign_ledger_type
      - size_bet
      - size_all_approved
      - check_risk_limits
      - get_bankroll
    reports_to: master
    risk_limits:
      max_single_bet_pct: 5.0          # % of bankroll
      max_daily_loss_pct: 10.0         # Stop-loss per day
      max_weekly_loss_pct: 20.0        # Stop-loss per week
      moonshot_hard_cap_eur: 1.00      # Parlay max stake
    schedule: null  # Triggered per bet sizing request

  # ── 8. MOONSHOT ARCHITECT (Parlay Builder) ──────────────────────────
  - id: moonshot
    name: "Moonshot Architect"
    role: "Parlay Builder & Correlation Analyst"
    llm_tier: tier1_heavy_reasoning
    soul_file: agents/moonshot/SOUL.md
    description: >
      Builds smart +EV parlays (Kombiwetten) from surviving single
      picks. Analyzes correlation between legs, avoids naive
      independence assumptions. Hard-capped at 1.00 EUR per ticket.
    tools:
      - build_parlay
      - check_leg_correlation
      - calculate_parlay_ev
      - validate_parlay_stake
    reports_to: master
    constraints:
      max_stake_eur: 1.00
      min_legs: 2
      max_legs: 6
      require_positive_ev: true
    schedule: null  # Triggered after single picks are approved

  # ── 9. AUDITOR (Feedback Loop) ──────────────────────────────────────
  - id: auditor
    name: "Auditor"
    role: "Performance Evaluator & Strategy Tuner"
    llm_tier: tier1_heavy_reasoning
    soul_file: agents/auditor/SOUL.md
    description: >
      Wakes up daily at 05:00 UTC to close the feedback loop:
      fetch final match results, settle pending bets, evaluate
      Brier Scores and ROI across Real/Paper ledgers, and trigger
      degradation alerts if model performance drops.
    tools:
      - fetch_and_update_results
      - settle_finished_matches
      - run_daily_audit
      - evaluate_model_performance
      - write_daily_metrics
      - check_rolling_degradation
      - calculate_brier_score
      - calculate_roi
      - query_model_metrics
      - query_placed_bets
      - recommend_strategy_adjustment
      - promote_or_demote_model
    reports_to: master
    schedule:
      morning_audit: "0 5 * * *"     # Every day at 05:00 UTC
      weekly_report: "0 8 * * 1"     # Every Monday at 08:00 UTC
    degradation_thresholds:
      brier_score_max: 0.22          # Above = degraded
      roi_min_pct: -5.0              # Below = degraded
      rolling_window_bets: 50        # Minimum bets before checking

# ══════════════════════════════════════════════════════════════════════
# INTERFACES — Command Center (Phase 5)
# ══════════════════════════════════════════════════════════════════════

interfaces:
  # ── WebUI (Streamlit) ─────────────────────────────────────────────
  webui:
    engine: streamlit
    entry_point: src/bet_agent/ui/app.py
    host: "0.0.0.0"
    port: 8501
    tabs:
      - pipeline     # Kanban: NOT STARTED → PENDING → VETOED → APPROVED → SETTLED
      - portfolio     # Time-series PnL, bankroll growth, sport exposure
      - mlops         # Model health, Brier Scores, ROI, killswitch
      - agent_logs    # Live tail of agent execution logs

  # ── Telegram Syndicate Bot ────────────────────────────────────────
  telegram:
    engine: python-telegram-bot
    entry_point: src/bet_agent/interfaces/telegram_bot.py
    mode: long_polling
    env_vars:
      bot_token: TELEGRAM_BOT_TOKEN
      allowed_ids: ALLOWED_TELEGRAM_IDS
      group_id: TELEGRAM_GROUP_ID
    commands:
      - /start    # Welcome + help
      - /status   # Daily portfolio summary
      - /pending  # Bets awaiting human execution
      - /pnl      # Balance & P&L
      - /health   # Model health overview
      - /placed   # Confirm bet placement (syncs to team)
    natural_language: true  # Free text → Master Agent concierge
    security:
      whitelist_mode: strict
      fail_behavior: silent_block  # Unauthorized users get no response
      audit_log: true              # Log all unauthorized attempts
