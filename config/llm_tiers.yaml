# LLM Tier Configuration for BetAgent MAS
# ─────────────────────────────────────────
# Tier 1: Heavy reasoning tasks (orchestration, veto, parlay logic, auditing)
# Tier 2: Local tool calling & scraping (fast, private, cost-free)
#
# Each tier defines an ordered list of providers. The client tries them
# in sequence and falls through on failure (missing creds, timeout, error).

tiers:
  tier1_heavy_reasoning:
    description: "Strategic reasoning, orchestration, qualitative analysis"
    providers:
      - provider: openclaw
        model: openclaw/codex
        auth: codex_cli              # Auto-refresh from ~/.codex/auth.json
        auth_env: OPENCLAW_OAUTH_TOKEN  # Fallback if ~/.codex/auth.json missing
        max_tokens: 8192
        temperature: 0.2
        timeout_seconds: 60
      - provider: openrouter
        model: openrouter/hunter-alpha   # Default; override via env
        model_env: OPENROUTER_MODEL        # e.g. meta-llama/llama-4-scout
        api_key_env: OPENROUTER_API_KEY
        max_tokens: 8192
        temperature: 0.2
        timeout_seconds: 60
      - provider: google
        model: gemini-2.0-flash
        api_key_env: GEMINI_API_KEY
        max_tokens: 8192
        temperature: 0.3
        timeout_seconds: 45

  tier2_local_tools:
    description: "Tool calling, scraping, data processing — runs on Mac Mini"
    providers:
      - provider: ollama
        model: ollama/gemma3:4b
        base_url_env: OLLAMA_BASE_URL
        max_tokens: 4096
        temperature: 0.1
        timeout_seconds: 30
    # No fallback — local-only for cost and privacy
